<!DOCTYPE html>
<html>
<head>

<title>Khushi Gaming PvP Tournament</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Arial,sans-serif;
}


html,body{

    width:100%;
    height:100%;
    overflow:hidden;
    color:#3b2b35;

}


/* BACKGROUND */

body{

    height:100vh;

    display:flex;
    flex-direction:column;

    background:
    radial-gradient(circle at top,#ffd6e8 0%,transparent 35%),
    linear-gradient(135deg,#fff8fb,#f7eef2,#ffffff);

}


/* PARTICLES */

body::before{

content:"";

position:fixed;

width:200%;
height:200%;

background:
radial-gradient(circle,#c989a655 2px,transparent 3px);

background-size:80px 80px;

animation:bg 35s linear infinite;

z-index:-1;

opacity:.6;

}


@keyframes bg{

from{
transform:translate(0,0);
}

to{
transform:translate(-350px,-350px);
}

}



/* HEADER */

.header{

height:85px;

flex-shrink:0;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 45px;

margin:15px auto 5px auto;

width:86%;

background:
rgba(255,255,255,.85);

backdrop-filter:blur(20px);

border-radius:50px;


box-shadow:
0 20px 50px rgba(120,60,80,.18);

}



.logo{

font-size:26px;

font-weight:900;

letter-spacing:2px;

color:#8d4b60;

}



/* MENU */

.menu{

display:flex;

gap:14px;

}



.menu button{

padding:13px 35px;

border-radius:35px;

border:none;

background:white;

color:#8d4b60;

font-weight:900;

cursor:pointer;

transition:.3s;

box-shadow:
inset 0 0 0 1px #e8cbd5;

}



.menu button:hover,
.menu button.active{


background:#8d4b60;

color:white;

transform:translateY(-3px);

box-shadow:
0 12px 25px rgba(141,75,96,.35);

}



/* STATUS */

.status{

flex-shrink:0;

width:86%;

margin:15px auto;

padding:12px;

text-align:center;

border-radius:30px;

background:
rgba(255,255,255,.85);


font-weight:bold;


color:#8d4b60;


box-shadow:
0 10px 35px rgba(120,70,90,.15);


}



/* BRACKET */

.bracket{


width:86%;

flex:1;

min-height:0;

margin:
0 auto 25px auto;

position:relative;

overflow:auto;


background:#202020;


border-radius:20px;


box-shadow:
0 25px 70px rgba(80,40,60,.25);


}



/* Scrollbar */


.bracket::-webkit-scrollbar{

width:8px;

height:8px;

}


.bracket::-webkit-scrollbar-track{

background:#f8e9ef;

}


.bracket::-webkit-scrollbar-thumb{

background:#8d4b60;

border-radius:20px;

}





iframe{

width:100%;

height:100%;

border:none;

display:block;

transition:.4s;

}



/* Loader */


.loader{

position:absolute;

inset:0;

display:none;

align-items:center;

justify-content:center;

background:#fff8fbdd;

font-size:28px;

font-weight:bold;

z-index:10;

color:#8d4b60;

}


.loader.show{

display:flex;

}



/* FULLSCREEN */


.full{

position:absolute;

right:25px;

bottom:25px;

padding:14px 30px;

border-radius:35px;

border:none;


background:#8d4b60;


color:white;


font-weight:bold;

cursor:pointer;


box-shadow:
0 15px 35px rgba(141,75,96,.45);


z-index:20;

transition:.3s;

}


.full:hover{

transform:scale(1.08);

}



/* MOBILE */

@media(max-width:900px){


.header{

width:95%;

height:auto;

flex-direction:column;

padding:20px;

border-radius:30px;

}



.logo{

font-size:22px;

margin-bottom:15px;

text-align:center;

}



.menu{

justify-content:center;

}



.status,
.bracket{

width:95%;

}


}

</style>

</head>


<body>


<div class="header">


<div class="logo">

Khushi Gaming PvP Tournament

</div>



<div class="menu">


<button class="active" onclick="change(this,'https://challonge.com/pokkiesmp_finals_java/module')">

JAVA

</button>


<button onclick="change(this,'https://challonge.com/pookismp_final_bedrock/module')">

BEDROCK

</button>


</div>

</div>




<div class="status" id="status">

Viewing: JAVA Bracket

</div>




<div class="bracket">


<div class="loader" id="loader">

Loading Bracket...

</div>



<iframe

id="frame"

onload="finish()"

src="https://challonge.com/pokkiesmp_finals_java/module">

</iframe>




<button class="full" onclick="full()">

⛶ Fullscreen

</button>


</div>





<script>


const frame =
document.getElementById("frame");


const loader =
document.getElementById("loader");



function change(btn,url){


loader.classList.add("show");


frame.style.opacity="0";



setTimeout(()=>{


frame.src=url;


},300);



document.querySelectorAll(".menu button")

.forEach(x=>{

x.classList.remove("active");

});



btn.classList.add("active");



document.getElementById("status").innerHTML =

"Viewing: " + btn.innerText + " Bracket";


}




function finish(){


loader.classList.remove("show");


frame.style.opacity="1";


}




function full(){


document.querySelector(".bracket")
.requestFullscreen();


}


</script>


</body>
</html>
