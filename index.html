<!DOCTYPE html>
<html>
<head>

<title>Khushi Gaming PvP Tournament</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Arial,sans-serif;
}


html,body{

    width:100%;
    height:100%;

    overflow:hidden;

    color:white;

}


body{

    height:100vh;

    display:flex;

    flex-direction:column;


    background:
    radial-gradient(circle at top left,#ff00cc55,transparent 35%),
    linear-gradient(135deg,#100014,#220020,#050005);

}


/* Animated BG */


body::before{

content:"";

position:fixed;

width:200%;
height:200%;


background:
radial-gradient(circle,#ff66dd55 2px,transparent 3px);


background-size:70px 70px;


animation:bg 30s linear infinite;


z-index:-1;

}


@keyframes bg{


from{

transform:translate(0,0);

}


to{

transform:translate(-350px,-350px);

}

}




/* HEADER */


.header{


height:90px;


flex-shrink:0;


display:flex;


align-items:center;


justify-content:space-between;


padding:0 35px;


background:#120014dd;


backdrop-filter:blur(15px);


border-bottom:2px solid #ff00cc;


box-shadow:
0 0 30px #ff00cc;


}




.logo{


font-size:30px;


font-weight:900;


text-shadow:

0 0 15px #ff00cc,

0 0 35px #ff00cc;


}




/* MENU */


.menu{

display:flex;

gap:12px;

flex-wrap:wrap;

justify-content:flex-end;

}



.menu button{


padding:12px 18px;


border-radius:30px;


border:none;


background:
linear-gradient(
45deg,
#ff00cc,
#ff70df
);


color:white;


font-weight:800;


cursor:pointer;


transition:.3s;


box-shadow:

0 0 15px #ff00cc88;


}



.menu button:hover,
.menu button.active{


background:white;


color:#ff00cc;


transform:scale(1.08);


box-shadow:

0 0 30px #ff00cc;


}





/* STATUS */


.status{


flex-shrink:0;


width:96%;


margin:12px auto;


padding:10px;


text-align:center;


border-radius:15px;


background:#ff00cc22;


border:1px solid #ff64dd;


font-weight:bold;


box-shadow:

0 0 15px #ff00cc55;


}





/* BRACKET BOX */


.bracket{


width:96%;


/* IMPORTANT FIX */
flex:1;


min-height:0;


margin:

0 auto 15px auto;


position:relative;


overflow:auto;


background:#202020;


border-radius:25px;


border:1px solid #ff64dd;


box-shadow:

0 0 35px #ff00cc99,

inset 0 0 30px #ff00cc33;


}



/* Scrollbar */


.bracket::-webkit-scrollbar{

width:10px;

height:10px;

}


.bracket::-webkit-scrollbar-track{


background:#120012;


}


.bracket::-webkit-scrollbar-thumb{


background:#ff00cc;


border-radius:20px;


box-shadow:

0 0 15px #ff00cc;


}




/* IFRAME */


iframe{


width:100%;


height:100%;


border:none;


display:block;


transition:.4s;


}



/* Loader */


.loader{


position:absolute;


inset:0;


display:none;


align-items:center;


justify-content:center;


background:#050005ee;


font-size:28px;


font-weight:bold;


z-index:10;


text-shadow:

0 0 25px #ff00cc;


}



.loader.show{


display:flex;


}



/* Fullscreen */


.full{


position:absolute;


right:25px;


bottom:25px;


padding:12px 25px;


border-radius:25px;


border:none;


background:#ff00cc;


color:white;


font-weight:bold;


cursor:pointer;


box-shadow:

0 0 25px #ff00cc;


z-index:20;


}





/* MOBILE */


@media(max-width:900px){


.header{


height:auto;


flex-direction:column;


padding:20px;


}



.logo{


font-size:25px;


margin-bottom:15px;


}



.menu{


justify-content:center;


}


}

</style>

</head>



<body>


<div class="header">


<div class="logo">

⚔ Khushi Gaming PvP Tournament

</div>



<div class="menu">


<button class="active" onclick="change(this,'pookiesmp_netheritepvp')">
Netherite
</button>


<button onclick="change(this,'pookiesmp_macepvp')">
Mace
</button>


<button onclick="change(this,'pookiesmp_diamondpvp')">
Diamond
</button>


<button onclick="change(this,'pookiesmp_smpkit')">
SMP Kit
</button>


<button onclick="change(this,'pookiesmp_pe_netheritepvp')">
PE Netherite
</button>


<button onclick="change(this,'pookiesmp_pe_macepvp')">
PE Mace
</button>


<button onclick="change(this,'pookiesmp_pe_diamondpvp')">
PE Diamond
</button>


</div>

</div>





<div class="status" id="status">

🔥 Viewing : Netherite PvP

</div>





<div class="bracket">


<div class="loader" id="loader">

Loading Bracket...

</div>



<iframe

id="frame"

onload="finish()"

src="https://challonge.com/pookiesmp_netheritepvp/module">

</iframe>




<button class="full" onclick="full()">

⛶ Fullscreen

</button>


</div>






<script>


const frame =
document.getElementById("frame");


const loader =
document.getElementById("loader");




function change(btn,id){


loader.classList.add("show");


frame.style.opacity="0";



setTimeout(()=>{


frame.src =
"https://challonge.com/"+id+"/module";


},300);




document.querySelectorAll(".menu button")

.forEach(x=>{

x.classList.remove("active");

});



btn.classList.add("active");



document.getElementById("status").innerHTML =

"Viewing: " + btn.innerText + " PvP";


}




function finish(){


loader.classList.remove("show");


frame.style.opacity="1";


}





function full(){


document.querySelector(".bracket")
.requestFullscreen();


}



</script>



</body>
</html>
